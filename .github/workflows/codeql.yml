name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on top of PR runs so that newly disclosed CVE patterns are
    # re-evaluated against the existing main branch even between commits.
    - cron: "37 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Standard query suite + extended for security audits.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          # Private repo without GHAS cannot upload to Code scanning; SARIF → artifact below.
          # After enabling GHAS + code scanning: set upload to always, wait-for-processing to true,
          # add security-events: write to job permissions. See docs/quality-gate.md.
          upload: never
          wait-for-processing: false

      - name: Upload SARIF artifact
        if: always() && steps.analyze.conclusion != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: codeql-javascript-sarif
          path: ${{ steps.analyze.outputs.sarif-output }}
          retention-days: 30
          if-no-files-found: ignore
