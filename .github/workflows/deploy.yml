name: Deploy Plaud Server Exporter

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: plaud-server-exporter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            git remote set-url origin git@github.com:ksandrpetrov/plaud-server-exporter.git
            git fetch origin

            CURRENT_BRANCH="$(git rev-parse --abbrev-ref HEAD)"
            git reset --hard "origin/${CURRENT_BRANCH}"
            git clean -fd

            npm install --workspaces
            cd plaud-exporter
            npm install
            cd ..

            npm run verify
            npm run server:status

            systemctl restart plaud-exporter.service

            sleep 2
            systemctl status plaud-exporter.service --no-pager -l
            ss -ltnp | grep -E ':18080|:8080' || true
