name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml
    with:
      node-version: "22.x"

  build:
    name: Build and push image
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Required by docker/build-push-action for SBOM + SLSA provenance
      # (`sbom: true`, `provenance: mode=max`) so the attestations can be
      # signed and attached to the GHCR image.
      attestations: write
      id-token: write
    outputs:
      image_tag: ${{ steps.sha.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=sha-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Normalize sha tag
        id: sha
        run: |
          SHORT="${GITHUB_SHA::7}"
          echo "sha_tag=sha-${SHORT}" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Compose image tags
        id: dtags
        run: |
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha_tag }}"
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAGS="${TAGS},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.dtags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Supply-chain attestations: SBOM (CycloneDX/SPDX) + SLSA build provenance.
          # GHCR consumers can verify via `gh attestation verify` or `cosign verify`.
          sbom: true
          provenance: mode=max

      - name: Tag semver on release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.sha.outputs.sha_tag }}" \
            -t "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${VERSION}"

  docker-smoke:
    name: Docker image smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and smoke test image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image_tag }}"
          SKIP_BUILD=1 bash scripts/docker-smoke-image.sh "$IMAGE"

  deploy-docker:
    name: Deploy to production (Docker)
    needs: [build, docker-smoke]
    # Opt-in: only when Docker stack is bootstrapped under /opt/plaud-exporter.
    if: >-
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      && vars.PRODUCTION_DOCKER_DEPLOY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy over SSH (Docker)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_PULL_USER: ${{ github.actor }}
          SMOKE_PUBLIC_BASE_URL: ${{ vars.SMOKE_PUBLIC_BASE_URL }}
          APP_IMAGE: ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          export APP_IMAGE
          bash scripts/ci-deploy-remote.sh

      - name: Smoke prod (public HTTPS)
        if: vars.SMOKE_PUBLIC_BASE_URL != ''
        env:
          SMOKE_PUBLIC_BASE_URL: ${{ vars.SMOKE_PUBLIC_BASE_URL }}
        run: bash scripts/smoke-prod.sh

  deploy-systemd:
    name: Deploy to production (systemd)
    needs: checks
    # Default for VPS on /srv/plaud-exporter: push to main updates code + restarts bot.
    # Skipped when PRODUCTION_DOCKER_DEPLOY=true (Docker path owns production).
    if: >-
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
      && vars.PRODUCTION_DOCKER_DEPLOY != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Deploy over SSH (systemd)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_REPO_DIR: ${{ vars.DEPLOY_REPO_DIR }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GIT_FETCH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          export DEPLOY_REPO_DIR="${DEPLOY_REPO_DIR:-}"
          bash scripts/ci-deploy-systemd-remote.sh

      - name: Smoke prod (public HTTPS)
        if: vars.SMOKE_PUBLIC_BASE_URL != ''
        env:
          SMOKE_PUBLIC_BASE_URL: ${{ vars.SMOKE_PUBLIC_BASE_URL }}
        run: bash scripts/smoke-prod.sh
