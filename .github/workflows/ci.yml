name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, verify, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.x", "22.x"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install workspaces (server)
        run: npm install --workspaces --ignore-scripts

      - name: Install extension devDependencies
        working-directory: plaud-exporter
        run: npm install --ignore-scripts

      - name: Lint (server)
        run: npm run lint

      - name: Lint (extension)
        working-directory: plaud-exporter
        run: npm run lint

      - name: Verify shared common imports
        run: npm run verify

      - name: Verify extension dynamic imports
        working-directory: plaud-exporter
        run: npm run verify

      - name: Test server
        run: npm test

      - name: Test extension
        run: npm run test:submodule
