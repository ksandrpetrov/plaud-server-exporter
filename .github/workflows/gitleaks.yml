name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history rescan catches secrets retroactively flagged by
    # gitleaks rule updates between active development bursts.
    - cron: "13 4 * * 1"

permissions:
  contents: read
  # gitleaks-action lists PR commits via API on pull_request; posts review comments
  # and uploads SARIF when GITLEAKS_ENABLE_* are true (defaults).
  pull-requests: write
  actions: write

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history for retro scans)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
