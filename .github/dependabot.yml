version: 2
updates:
  # Root workspace (server depends live here + dev tooling: typescript, prettier).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - npm
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      security-patches:
        applies-to: security-updates
        update-types:
          - patch
          - minor

  # Chrome extension (separate package-lock.json).
  - package-ecosystem: npm
    directory: /browser-extension
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - npm
      - extension
    groups:
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch

  # GitHub Actions used in workflows + composite action. Low churn, so monthly
  # cadence and a single grouped PR keep each refresh to one CI run instead of
  # one-PR-per-action (which previously fanned out into a minute-burning burst).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /.github/actions/setup-monorepo
    schedule:
      interval: monthly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    groups:
      github-actions:
        patterns:
          - "*"

  # Production runtime image (Node base + apt packages tracked via Docker layer).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
