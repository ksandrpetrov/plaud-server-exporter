title = "plaud-server-exporter gitleaks config"

# We rely on the upstream default rule set; this file only adds allowlists
# for files and patterns that are known-safe (docs, examples, test fixtures).
[extend]
useDefault = true

[allowlist]
description = "Project-specific allowlist (no real secrets here)."
paths = [
    # Example env never holds real credentials; placeholders mimic shapes.
    '''(^|/)\.env\.example$''',
    # Documentation references token/cookie patterns purely as examples.
    '''^docs/''',
    # Shell smoke tests use intentionally fake credentials like "smoke:token".
    '''^scripts/docker-smoke-image\.sh$''',
    '''^scripts/smoke-prod\.sh$''',
    # Redaction tests intentionally contain token-shaped fixtures.
    '''^server/tests/redact\.test\.js$''',
]

regexes = [
    # Container/integration smoke test placeholder for Telegram bot token format.
    '''smoke:token''',
    # Placeholder for tests using "Bearer t.t.t".
    '''Bearer\s+t\.t\.t''',
    # JSON test fixtures occasionally embed `fake-`/`example-` markers.
    '''(fake|example|placeholder)-[a-z0-9_-]+''',
]
